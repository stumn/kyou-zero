<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>きょうゼロ</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    html {
      scroll-behavior: smooth
    }

    body {
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 9999px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #fff 0%, #dbeafe 18%, #93c5fd 40%, #3b82f6 72%, #1d4ed8 100%);
      box-shadow: 0 0 0 10px rgba(59, 130, 246, .08), 0 0 0 22px rgba(59, 130, 246, .04), 0 24px 60px rgba(59, 130, 246, .25)
    }

    .dark .orb {
      background: radial-gradient(circle at 30% 30%, #dbeafe 0%, #93c5fd 18%, #60a5fa 40%, #2563eb 72%, #1e3a8a 100%)
    }

    .orb span {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, .9);
      animation: float 3.2s linear infinite
    }

    .orb span:nth-child(1) {
      left: 28px;
      bottom: 18px;
      animation-delay: 0s
    }

    .orb span:nth-child(2) {
      left: 58px;
      bottom: 12px;
      animation-delay: .7s
    }

    .orb span:nth-child(3) {
      left: 90px;
      bottom: 20px;
      animation-delay: 1.4s
    }

    .orb span:nth-child(4) {
      left: 46px;
      bottom: 26px;
      animation-delay: 2.1s
    }

    @keyframes float {
      from {
        transform: translateY(0) scale(1);
        opacity: 1
      }

      to {
        transform: translateY(-120px) scale(.3);
        opacity: 0
      }
    }

    .bingo-cell {
      transition: all .18s ease
    }

    .bingo-cell:active {
      transform: scale(.98)
    }

    .bingo-selected {
      border-color: rgb(59 130 246) !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .12)
    }

    .dark .bingo-selected {
      border-color: rgb(96 165 250) !important;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, .16)
    }

    .bingo-done-single {
      background: rgb(59 130 246) !important;
      color: #fff !important;
      border-color: rgb(59 130 246) !important
    }

    .dark .bingo-done-single {
      background: rgb(96 165 250) !important;
      border-color: rgb(96 165 250) !important;
      color: rgb(15 23 42) !important
    }

    .bingo-done-cont {
      background: rgb(124 58 237) !important;
      color: #fff !important;
      border-color: rgb(124 58 237) !important
    }

    .dark .bingo-done-cont {
      background: rgb(167 139 250) !important;
      border-color: rgb(167 139 250) !important;
      color: rgb(15 23 42) !important
    }

    .action-btn:active {
      transform: scale(.98)
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div class="max-w-5xl mx-auto min-h-screen p-4 lg:p-6 space-y-4 lg:space-y-6">

    <header class="flex items-center justify-between">
      <div>
        <div id="dateText" class="text-sm text-slate-500 dark:text-slate-400"></div>
        <div id="timeText" class="text-2xl lg:text-3xl font-semibold tracking-tight"></div>
      </div>
      <div class="flex items-center gap-2">
        <button id="syncBtn"
          class="h-11 px-4 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm text-sm font-medium action-btn">
          ☁️ 同期
        </button>
        <button id="themeBtn"
          class="h-11 w-11 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm text-lg action-btn">
          🌙
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 items-start">

      <div class="lg:col-span-8 xl:col-span-8 space-y-4 lg:space-y-6">

        <section
          class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm overflow-hidden">
          <div id="startView" class="p-6 lg:p-8 text-center space-y-4">
            <div
              class="inline-flex items-center gap-2 rounded-full border border-blue-200 dark:border-blue-900/50 bg-blue-50 dark:bg-blue-950/40 px-3 py-1 text-xs font-medium text-blue-700 dark:text-blue-300">
              ✨ しゅわっと開始
            </div>
            <div class="mx-auto orb">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="space-y-1">
              <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">きょうゼロ</h1>
              <p class="text-sm text-slate-500 dark:text-slate-400">昨日は保存されました。今日は減点されません。</p>
            </div>
            <button id="startBtn"
              class="w-full rounded-2xl bg-blue-600 text-white py-3.5 font-semibold shadow-sm action-btn">
              昨日を手放して、きょうを始める
            </button>
          </div>

          <div id="scoreView" class="hidden p-6 lg:p-8 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-sm text-slate-500 dark:text-slate-400">きょうのスコア</div>
                <div id="scoreValue" class="text-5xl lg:text-6xl font-bold tracking-tight">0</div>
              </div>
              <div class="text-right">
                <div class="text-sm text-slate-500 dark:text-slate-400">負債</div>
                <div class="text-2xl font-bold text-blue-600 dark:text-blue-400">0</div>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-3">
              <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-3 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400">達成 (+5)</div>
                <div id="doneCount" class="text-xl font-semibold">0</div>
              </div>
              <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-3 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400">リーチ (+10)</div>
                <div id="reachCount" class="text-xl font-semibold">0</div>
              </div>
              <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-3 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400">ビンゴ (+25)</div>
                <div id="bingoCount" class="text-xl font-semibold">0</div>
              </div>
            </div>
          </div>
        </section>

        <section
          class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-5 lg:p-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-lg font-semibold">ビンゴ</h2>
              <p class="text-sm text-slate-500 dark:text-slate-400">単発と継続を混ぜて、きょうの9マスを埋める</p>
            </div>
          </div>

          <div id="bingoGrid" class="grid grid-cols-3 gap-3"></div>

          <div class="mt-4 flex items-center justify-between text-sm text-slate-500 dark:text-slate-400">
            <span>リーチで +10</span>
            <span>ビンゴで +25</span>
          </div>
        </section>

        <section
          class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-5 lg:p-6">
          <div class="mb-4">
            <h2 class="text-lg font-semibold">その他の行動</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">ビンゴ以外の行動を選択して、15分タイマーを設定できます。</p>
          </div>

          <div id="otherActionsContainer" class="grid grid-cols-2 gap-3"></div>
        </section>

      </div>

      <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:space-y-6">

        <section id="timerSection"
          class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-5 lg:p-6">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-lg font-semibold">タイマー</h2>
              <p id="timerLabel" class="text-sm text-slate-500 dark:text-slate-400">ビンゴから選ぶとここに表示されます</p>
            </div>
            <div id="timerTypeBadge"
              class="hidden rounded-full px-3 py-1 text-xs font-medium bg-blue-100 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300">
              単発
            </div>
          </div>

          <div class="text-center py-4">
            <div id="timerDisplay" class="text-6xl font-bold tracking-tight">15:00</div>
            <div id="timerHint" class="mt-2 text-sm text-slate-500 dark:text-slate-400">映画を見ながら気づきをメモする</div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button id="startTimerBtn"
              class="rounded-2xl bg-blue-600 text-white py-3.5 font-semibold shadow-sm disabled:opacity-40 disabled:cursor-not-allowed action-btn"
              disabled>
              はじめる
            </button>
            <button id="stopTimerBtn"
              class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-3.5 font-semibold text-slate-700 dark:text-slate-200 action-btn">
              停止
            </button>
          </div>

          <button id="completeBtn"
            class="mt-3 w-full rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60 py-3.5 font-semibold text-slate-700 dark:text-slate-200 action-btn">
            このマスを達成する
          </button>
        </section>

        <section
          class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm p-5 lg:p-6">
          <div class="mb-3">
            <h2 class="text-lg font-semibold">書き残し</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">今日の痕跡を一言だけ。</p>
          </div>

          <input id="memo" maxlength="120" type="text"
            class="w-full h-12 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 px-4 text-[15px] outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="今日はここまでやれた" />

          <div class="mt-2 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <span>ローカルに保存されます</span>
            <span id="memoCount">0 / 120文字</span>
          </div>
        </section>

      </div>
    </div>

    <div class="text-center text-xs text-slate-400 dark:text-slate-500 py-4">
      昨日は保存される。きょうはゼロから。
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'kyou-zero-pro-v2';

    // Supabase (replace with your values)
    const SUPABASE_URL = 'https://rortxwatkzyuexrbznvo.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_cKWkokv4nf4hDz6Vt8abvw_kxNBzrQF'
    const sb = window.supabase?.createClient?.(SUPABASE_URL, SUPABASE_KEY)

    const TASK_POOL = [
      { label: '映画', type: 'single', minutes: 15 },
      { label: 'プロト', type: 'single', minutes: 15 },
      { label: 'DIY', type: 'single', minutes: 15 },
      { label: '裁縫', type: 'single', minutes: 15 },
      { label: '読書', type: 'single', minutes: 15 },
      { label: '散歩', type: 'single', minutes: 15 },
      { label: '片付け', type: 'single', minutes: 15 },
      { label: 'コード', type: 'cont', minutes: 25 },
      { label: '研究', type: 'cont', minutes: 25 },
      { label: 'Cosense', type: 'cont', minutes: 25 },
      { label: 'スケジュール', type: 'cont', minutes: 25 },
      { label: 'TRN', type: 'cont', minutes: 25 },
      { label: '英語', type: 'cont', minutes: 25 },
      { label: 'ブログ', type: 'cont', minutes: 25 },
      { label: '筋トレ', type: 'cont', minutes: 25 },
    ];

    const defaultOtherActions = [
      { label: '🧹 掃除', count: 0 },
      { label: '📦 片付け', count: 0 },
      { label: '📝 Google Keep', count: 0 },
      { label: '💬 ChatGPTと話す', count: 0 },
    ];

    function getJstDateString() {
      const formatter = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      return formatter.format(new Date()).replace(/\//g, '-');
    }

    function generateBingo(taskStats) {
      const stats = taskStats || {};
      const getWeight = (task) => {
        const count = stats[task.label]?.count || 0;
        return 1 / (count + 1);
      };

      const singles = TASK_POOL.filter(t => t.type === 'single');
      const conts = TASK_POOL.filter(t => t.type === 'cont');

      const selectTasks = (pool, countNeeded) => {
        return pool
          .map(task => ({ task, weight: getWeight(task) * (0.8 + Math.random() * 0.4) }))
          .sort((a, b) => b.weight - a.weight)
          .slice(0, countNeeded)
          .map(item => item.task);
      };

      const selectedSingles = selectTasks(singles, 4);
      const selectedConts = selectTasks(conts, 5);
      const combined = [...selectedSingles, ...selectedConts];

      for (let i = combined.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [combined[i], combined[j]] = [combined[j], combined[i]];
      }

      return combined.map((task, index) => ({
        id: index + 1,
        label: task.label,
        type: task.type,
        minutes: task.minutes,
        count: 0
      }));
    }

    const todayJst = getJstDateString();
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');

    if (!state) {
      state = {
        started: false,
        theme: 'light',
        bingo: generateBingo({}),
        otherActions: defaultOtherActions,
        taskStats: {},
        lastActiveDate: todayJst,
        extraScore: 0,
        memo: ''
      };
    }

    // 互換性チェック
    if (!state.otherActions) state.otherActions = defaultOtherActions;
    if (!state.taskStats) state.taskStats = {};
    if (!state.lastActiveDate) state.lastActiveDate = todayJst;
    if (state.bingo) {
      state.bingo.forEach(cell => {
        if (cell.count === undefined) {
          cell.count = cell.done ? 1 : 0;
        }
      });
    }

    const startView = document.getElementById('startView');
    const scoreView = document.getElementById('scoreView');
    const scoreValue = document.getElementById('scoreValue');
    const doneCountEl = document.getElementById('doneCount');
    const reachCountEl = document.getElementById('reachCount');
    const bingoCountEl = document.getElementById('bingoCount');
    const bingoGrid = document.getElementById('bingoGrid');

    const timerSection = document.getElementById('timerSection');
    const timerLabel = document.getElementById('timerLabel');
    const timerTypeBadge = document.getElementById('timerTypeBadge');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerHint = document.getElementById('timerHint');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const stopTimerBtn = document.getElementById('stopTimerBtn');
    const completeBtn = document.getElementById('completeBtn');

    const memo = document.getElementById('memo');
    const memoCount = document.getElementById('memoCount');

    let selectedTask = null;
    let timerSeconds = 15 * 60;
    let timerId = null;

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    let syncTimer = null;

    async function syncSave() {
      if (!sb) return;
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;
      await sb.from('daily_state').upsert({ user_id: user.id, day: getJstDateString(), started: state.started, bingo: state.bingo, memo: state.memo, extra_score: state.extraScore || 0, updated_at: new Date().toISOString() });
    }

    function debouncedSyncSave() {
      clearTimeout(syncTimer); syncTimer = setTimeout(syncSave, 1200);
    }

    function applyTheme() {
      const dark = state.theme === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      document.body.classList.toggle('dark', dark);
      document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#020617' : '#F8FAFC');
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(); save();
    });

    function updateDateTime() {
      const now = new Date();
      document.getElementById('dateText').textContent =
        now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.getElementById('timeText').textContent =
        now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    }
    updateDateTime(); setInterval(updateDateTime, 1000);

    function showStarted() { startView.classList.add('hidden'); scoreView.classList.remove('hidden'); }

    document.getElementById('startBtn').addEventListener('click', () => {
      startView.style.opacity = '0'; startView.style.transform = 'scale(.98)';
      setTimeout(() => { state.started = true; showStarted(); save(); }, 420);
    });
    if (state.started) showStarted();

    const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

    function calcStats() {
      const doneCount = state.bingo.reduce((sum, c) => sum + (c.count || 0), 0);
      let reach = 0, bingo = 0;
      for (const line of lines) {
        const count = line.map(i => state.bingo[i].count > 0).filter(Boolean).length;
        if (count === 2) reach++;
        if (count === 3) bingo++;
      }
      return { done: doneCount, reach, bingo, score: doneCount * 5 + reach * 10 + bingo * 25 + (state.extraScore || 0) };
    }

    function renderScore() {
      const s = calcStats();
      scoreValue.textContent = s.score;
      doneCountEl.textContent = s.done;
      reachCountEl.textContent = s.reach;
      bingoCountEl.textContent = s.bingo;
    }

    function renderBingo() {
      bingoGrid.innerHTML = '';
      state.bingo.forEach(cell => {
        const btn = document.createElement('button');
        const borderClass = cell.type === 'single'
          ? 'border-sky-300 dark:border-sky-600'
          : 'border-violet-300 dark:border-violet-600';
        btn.className = `bingo-cell rounded-2xl border ${borderClass} bg-slate-50 dark:bg-slate-800/60 p-2 flex items-center justify-center text-center h-16 lg:h-20 relative`;
        
        const isCompleted = cell.count > 0;
        if (isCompleted) {
          btn.classList.add(cell.type === 'single' ? 'bingo-done-single' : 'bingo-done-cont');
        }
        
        const isSelected = selectedTask && selectedTask.type === 'bingo' && selectedTask.id === cell.id;
        if (isSelected) btn.classList.add('bingo-selected');
        
        btn.innerHTML = `
          <div class="text-[13px] lg:text-sm font-semibold leading-snug break-words">${cell.label}</div>
          ${cell.count > 1 ? `<div class="absolute top-1 right-2 text-[10px] font-bold bg-white/20 text-white rounded-full px-1.5 min-w-[16px] h-4 flex items-center justify-center">${cell.count}</div>` : ''}
        `;
        
        btn.addEventListener('click', () => {
          selectedTask = {
            type: 'bingo',
            id: cell.id,
            label: cell.label,
            minutes: cell.minutes,
            taskType: cell.type
          };
          timerSeconds = cell.minutes * 60;
          updateTimerDisplay();
          timerLabel.textContent = cell.label;
          timerHint.textContent = cell.type === 'single' ? '気づきや受け取ったこともメモする' : '積み上げに集中する';
          timerTypeBadge.textContent = cell.type === 'single' ? '単発' : '継続';
          timerTypeBadge.classList.remove('hidden');
          startTimerBtn.disabled = false;
          
          renderBingo();
          renderOtherActions();
          timerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        bingoGrid.appendChild(btn);
      });
      renderScore();
    }

    function renderOtherActions() {
      const container = document.getElementById('otherActionsContainer');
      container.innerHTML = '';
      
      state.otherActions.forEach(action => {
        const btn = document.createElement('button');
        const isCompleted = action.count > 0;
        const isSelected = selectedTask && selectedTask.type === 'other' && selectedTask.label === action.label;
        
        btn.className = `other-action rounded-2xl border p-4 text-center action-btn relative h-16 flex items-center justify-center text-sm font-semibold break-words transition-all duration-150 ${
          isCompleted 
            ? 'bingo-done-single border-blue-600 dark:border-blue-400' 
            : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60'
        }`;
        
        if (isSelected) {
          btn.classList.add('bingo-selected');
        }
        
        btn.innerHTML = `
          <span>${action.label}</span>
          ${action.count > 1 ? `<div class="absolute top-1 right-2 text-[10px] font-bold bg-white/20 text-white rounded-full px-1.5 min-w-[16px] h-4 flex items-center justify-center">${action.count}</div>` : ''}
        `;
        
        btn.addEventListener('click', () => {
          selectedTask = {
            type: 'other',
            id: null,
            label: action.label,
            minutes: 15,
            taskType: 'single'
          };
          timerSeconds = 15 * 60;
          updateTimerDisplay();
          timerLabel.textContent = action.label;
          timerHint.textContent = '気づきや受け取ったこともメモする';
          timerTypeBadge.textContent = '単発';
          timerTypeBadge.classList.remove('hidden');
          startTimerBtn.disabled = false;
          
          renderBingo();
          renderOtherActions();
          timerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        
        container.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-600 p-4 text-center action-btn h-16 flex items-center justify-center text-sm text-slate-500 dark:text-slate-400 gap-1';
      addBtn.innerHTML = '➕ 追加';
      addBtn.addEventListener('click', () => {
        const label = prompt('追加する行動の名前を入力してください（例: 🏃 散歩）');
        if (label && label.trim()) {
          state.otherActions.push({ label: label.trim(), count: 0 });
          renderOtherActions();
          save();
          debouncedSyncSave();
        }
      });
      container.appendChild(addBtn);
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
    }
    updateTimerDisplay();

    function resetTimerUI() {
      timerSeconds = 15 * 60;
      updateTimerDisplay();
      timerLabel.textContent = 'ビンゴから選ぶとここに表示されます';
      timerHint.textContent = '次のマスを選んで、はじめるを押してください';
      timerTypeBadge.classList.add('hidden');
      startTimerBtn.disabled = true;
      clearInterval(timerId);
      timerId = null;
    }

    startTimerBtn.addEventListener('click', () => {
      if (selectedTask == null) return;
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (timerSeconds > 0) { timerSeconds--; updateTimerDisplay(); }
        else {
          clearInterval(timerId);
          timerHint.textContent = 'おつかれさま。達成ボタンでマスを埋めよう。';
          if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        }
      }, 1000);
    });

    stopTimerBtn.addEventListener('click', () => clearInterval(timerId));

    completeBtn.addEventListener('click', () => {
      if (selectedTask == null) return;
      
      if (selectedTask.type === 'bingo') {
        const cell = state.bingo.find(c => c.id === selectedTask.id);
        cell.count = (cell.count || 0) + 1;
      } else if (selectedTask.type === 'other') {
        const action = state.otherActions.find(a => a.label === selectedTask.label);
        action.count = (action.count || 0) + 1;
        state.extraScore = (state.extraScore || 0) + 1;
      }
      
      selectedTask = null;
      resetTimerUI();
      renderBingo();
      renderOtherActions();
      save();
      debouncedSyncSave();
    });

    memo.value = state.memo;
    memoCount.textContent = `${memo.value.length} / 120文字`;
    memo.addEventListener('input', () => {
      memoCount.textContent = `${memo.value.length} / 120文字`;
      state.memo = memo.value; save();
    });

    document.getElementById('syncBtn').addEventListener('click', async () => {
      const { data: { user } } = await sb.auth.getUser();

      if (user) {
        alert(`同期済み: ${user.email}`);
        return;
      }

      const email = prompt('同期に使うメールアドレスを入力してください');
      if (!email) return;

      const { error } = await sb.auth.signInWithOtp({ email });

      if (error) {
        alert('送信失敗: ' + error.message);
      } else {
        alert('確認メールを送信しました');
      }
    });

    function checkDailyReset() {
      const currentJst = getJstDateString();
      if (state.lastActiveDate !== currentJst) {
        if (state.bingo) {
          state.bingo.forEach(cell => {
            if (cell.count > 0) {
              if (!state.taskStats[cell.label]) state.taskStats[cell.label] = { count: 0 };
              state.taskStats[cell.label].count += cell.count;
            }
          });
        }
        if (state.otherActions) {
          state.otherActions.forEach(action => {
            if (action.count > 0) {
              if (!state.taskStats[action.label]) state.taskStats[action.label] = { count: 0 };
              state.taskStats[action.label].count += action.count;
            }
          });
        }

        state.started = false;
        state.extraScore = 0;
        state.memo = '';
        
        state.otherActions.forEach(action => {
          action.count = 0;
        });

        state.bingo = generateBingo(state.taskStats);
        state.lastActiveDate = currentJst;
        save();
        
        if (startView && scoreView) {
          startView.classList.remove('hidden');
          startView.style.opacity = '1';
          startView.style.transform = 'scale(1)';
          scoreView.classList.add('hidden');
        }
        memo.value = '';
        document.getElementById('memoCount').textContent = '0 / 120文字';
        
        selectedTask = null;
        resetTimerUI();
        
        renderBingo();
        renderOtherActions();
      }
    }

    checkDailyReset();
    renderBingo();
    renderOtherActions();
    applyTheme();

    window.addEventListener('focus', checkDailyReset);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => { });
    }
  </script>
</body>

</html>
